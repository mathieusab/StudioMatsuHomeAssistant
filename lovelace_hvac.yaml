title: HVAC Control
views:
  - title: HVAC
    path: hvac
    icon: mdi:fan
    cards:
      - type: markdown
        content: |
          ## HVAC Control
          Choose the desired speed for each zone and check the actual speed applied by the relays.

      - type: vertical-stack
        cards:
          - type: entities
            title: HVAC Main
            show_header_toggle: false
            entities:
              - entity: input_select.hvac_main_speed
                name: Desired Speed
              - entity: sensor.hvac_main_actual_speed
                name: Actual Speed

          - type: glance
            title: Relays — HVAC Main
            show_state: true
            columns: 2
            entities:
              - entity: switch.hvac_relay_l3
                name: "Relay C"
                icon: mdi:electric-switch
              - entity: switch.hvac_relay_l4
                name: "Relay D"
                icon: mdi:electric-switch

      - type: vertical-stack
        cards:
          - type: entities
            title: HVAC Drums and Toilets
            show_header_toggle: false
            entities:
              - entity: input_select.hvac_drums_and_toilets_speed
                name: Desired Speed
              - entity: sensor.hvac_drums_and_toilets_actual_speed
                name: Actual Speed

          - type: glance
            title: Relays — Drums and Toilets
            show_state: true
            columns: 2
            entities:
              - entity: switch.hvac_relay_l1
                name: "Relay A"
                icon: mdi:electric-switch
              - entity: switch.hvac_relay_l2
                name: "Relay B"
                icon: mdi:electric-switch