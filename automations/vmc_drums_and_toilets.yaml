# =============================================================================
# Automations VMC Toilettes/Batterie
# Déclenchées par le changement de l'input_select
# =============================================================================

- id: vmc_tb_changement_vitesse
  alias: "VMC Toilettes/Batterie — Changement de vitesse"
  description: "Applique la vitesse sélectionnée dans l'interface"
  trigger:
    - platform: state
      entity_id: input_select.vmc_toilettes_batterie_vitesse
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.vmc_toilettes_batterie_vitesse
              state: "Petite vitesse"
          sequence:
            - service: script.vmc_tb_petite_vitesse
        - conditions:
            - condition: state
              entity_id: input_select.vmc_toilettes_batterie_vitesse
              state: "Moyenne vitesse"
          sequence:
            - service: script.vmc_tb_moyenne_vitesse
        - conditions:
            - condition: state
              entity_id: input_select.vmc_toilettes_batterie_vitesse
              state: "Grande vitesse"
          sequence:
            - service: script.vmc_tb_grande_vitesse
  mode: single