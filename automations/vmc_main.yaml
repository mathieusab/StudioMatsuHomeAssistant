# =============================================================================
# Automations VMC Principale
# =============================================================================

- id: vmc_principale_changement_vitesse
  alias: "VMC Principale — Changement de vitesse"
  description: "Applique la vitesse sélectionnée dans l'interface"
  trigger:
    - platform: state
      entity_id: input_select.vmc_principale_vitesse
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.vmc_principale_vitesse
              state: "Petite vitesse"
          sequence:
            - service: script.vmc_principale_petite_vitesse
        - conditions:
            - condition: state
              entity_id: input_select.vmc_principale_vitesse
              state: "Moyenne vitesse"
          sequence:
            - service: script.vmc_principale_moyenne_vitesse
        - conditions:
            - condition: state
              entity_id: input_select.vmc_principale_vitesse
              state: "Grande vitesse"
          sequence:
            - service: script.vmc_principale_grande_vitesse
  mode: single