# =============================================================================
# Scripts VMC Toilettes/Batterie
# Relais A = switch.relais_vmc_l1
# Relais B = switch.relais_vmc_l2
#
# Logique câblage :
#   A OFF          → Petite vitesse
#   A ON  / B OFF  → Moyenne vitesse
#   A ON  / B ON   → Grande vitesse
# =============================================================================

vmc_tb_petite_vitesse:
  alias: "VMC Toilettes/Batterie — Petite vitesse"
  icon: mdi:fan-speed-1
  sequence:
    - service: switch.turn_off
      target:
        entity_id:
          - switch.relais_vmc_l1
          - switch.relais_vmc_l2

vmc_tb_moyenne_vitesse:
  alias: "VMC Toilettes/Batterie — Moyenne vitesse"
  icon: mdi:fan-speed-2
  sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.relais_vmc_l2
    - delay: "00:00:00.500"  # petit délai sécurité
    - service: switch.turn_on
      target:
        entity_id: switch.relais_vmc_l1

vmc_tb_grande_vitesse:
  alias: "VMC Toilettes/Batterie — Grande vitesse"
  icon: mdi:fan-speed-3
  sequence:
    - service: switch.turn_on
      target:
        entity_id:
          - switch.relais_vmc_l1
          - switch.relais_vmc_l2