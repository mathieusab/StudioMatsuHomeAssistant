# =============================================================================
# Templates VMC — Capteurs calculés pour afficher l'état réel des VMC
# à partir de l'état des relais Zigbee
# =============================================================================

# Noms des entités relais Zigbee2MQTT (à adapter selon le nom donné au pairing) :
#   switch.relais_vmc_l1  → Relais A VMC Toilettes/Batterie
#   switch.relais_vmc_l2  → Relais B VMC Toilettes/Batterie
#   switch.relais_vmc_l3  → Relais C VMC Principale
#   switch.relais_vmc_l4  → Relais D VMC Principale

- sensor:
    - name: "VMC Toilettes/Batterie — État réel"
      icon: mdi:fan
      state: >
        {% set a = states('switch.relais_vmc_l1') %}
        {% set b = states('switch.relais_vmc_l2') %}
        {% if a == 'off' %}
          Petite vitesse
        {% elif a == 'on' and b == 'off' %}
          Moyenne vitesse
        {% elif a == 'on' and b == 'on' %}
          Grande vitesse
        {% else %}
          Inconnu
        {% endif %}

    - name: "VMC Principale — État réel"
      icon: mdi:fan
      state: >
        {% set c = states('switch.relais_vmc_l3') %}
        {% set d = states('switch.relais_vmc_l4') %}
        {% if c == 'off' %}
          Petite vitesse
        {% elif c == 'on' and d == 'off' %}
          Moyenne vitesse
        {% elif c == 'on' and d == 'on' %}
          Grande vitesse
        {% else %}
          Inconnu
        {% endif %}